version: 2
updates:
  # Runtime stack (npm ecosystem covers the Bun project via bun.lock). Policy is
  # to chase the latest versions even at the cost of breakage — a bump that breaks
  # the build is fixed forward, not reverted (see AGENTS.md).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
