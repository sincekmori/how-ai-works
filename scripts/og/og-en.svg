      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g transform="translate(0,285)">

  <!-- chat bubble with the logo spark inside -->
