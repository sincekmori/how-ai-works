  <text x="90" y="245" font-family="Helvetica Neue, sans-serif" font-size="82" font-weight="700" fill="#ffffff">How AI Works</text>
  <text x="94" y="308" font-family="Helvetica Neue, sans-serif" font-size="46" font-weight="700" fill="#ffffff">and How to Use It</text>
  <text x="94" y="390" font-family="Helvetica Neue, sans-serif" font-size="40" fill="#d4d4d8">Why can an AI talk at all,</text>
